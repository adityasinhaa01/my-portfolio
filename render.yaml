services:
  # 1. Express Backend Web Service
  - type: web
    name: aditya-sinha-portfolio-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MONGODB_URI
        sync: false

  # 2. Frontend Static Site
  - type: web
    name: aditya-sinha-portfolio-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: aditya-sinha-portfolio-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
          # Appends /api automatically
